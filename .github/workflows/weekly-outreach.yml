name: Weekly Instructor Outreach

on:
  schedule:
    - cron: '0 8 * * 1'   # every Monday at 8:00 UTC      
  workflow_dispatch:

jobs:
  run-outreach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Recreate credentials.json from secret
        run: printf '%s' "$GOOGLE_CREDENTIALS" > credentials.json
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Run outreach script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node message.js